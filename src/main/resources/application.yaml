# application.yaml
spring:
  application:
    name: plataforma-comunicacion

  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  thymeleaf:
    cache: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

logging:
  level:
    root: INFO
    com.plataforma.comunicacion: INFO

ekko:
  turnstile:
    site-key: ${TURNSTILE_SITE_KEY}
    secret-key: ${TURNSTILE_SECRET_KEY}
    verify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify
    expected-hostname: ${TURNSTILE_HOSTNAME:localhost}