<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06284a">
    <title>Sin conexión · Ekko</title>
    <link rel="icon"
          type="image/svg+xml"
          href="/images/ekko-logo.svg">
    <link rel="stylesheet" href="/css/offline.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="/js/ekko-theme.js"></script>
</head>

<body>
    <main class="ek-center">
        <!-- Decoración de olas de Ekko -->
        <div class="ek-waves" aria-hidden="true">
            <div class="ek-wave"></div>
            <div class="ek-wave"></div>
            <div class="ek-wave"></div>
        </div>

        <section class="ek-center-card"
                 aria-labelledby="offlineTitle">
            <img class="ek-logo-mid"
                 src="/images/ekko-logo.svg"
                 alt="Logo de Ekko"
                 width="80"
                 height="80">
            <h1 class="ek-display" id="offlineTitle">
                Estás sin conexión
            </h1>
            <p class="ek-verify-msg"
               id="offlineMsg"
               role="status"
               aria-live="polite">
                Ekko no puede conectarse en este momento.
            </p>
            <p class="ek-hint offline-hint">
                Revisa tu conexión Wi-Fi o tus datos móviles.
                Cuando vuelvas a conectarte, podrás regresar a Ekko
                y retomar tus conversaciones.
            </p>
            <button class="ek-offline-button"
                    type="button"
                    onclick="window.location.reload()">
                <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
                Intentar de nuevo
            </button>
        </section>

        <footer class="ek-offline-footer">
            <strong>Ekko</strong>
            <span>Conversa sin fronteras.</span>
        </footer>
    </main>

    <script src="/js/offline.js"></script>
</body>
</html>
