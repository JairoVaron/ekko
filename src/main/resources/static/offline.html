<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0705">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Ekko no tiene conexión a Internet en este momento.">
    <title>Sin conexión · Ekko</title>

    <link rel="icon" type="image/svg+xml" href="/images/ekko-logo.svg">

    <!-- Solo estilos propios: esta página debe verse sin red -->
    <link rel="stylesheet" href="/css/core.css">
    <link rel="stylesheet" href="/css/offline.css">

    <script src="/js/ekko-theme.js"></script>
</head>
<body>

    <main class="ek-offline ek-card" aria-labelledby="offlineTitle">
        <img src="/images/ekko-logo.svg" alt="Logo de Ekko" width="90" height="90">

        <h1 class="ek-display" id="offlineTitle">Sin conexión</h1>

        <p id="offlineMsg" role="status" aria-live="polite">
            No podemos conectar con Ekko en este momento.
        </p>

        <p>Revisa tu Wi-Fi o tus datos móviles. Cuando vuelva la conexión, podrás seguir con tus conversaciones.</p>

        <button type="button" class="btn-ekko" id="retryConnection">
            <span aria-hidden="true">↻</span> Reintentar
        </button>

        <p class="ek-offline-brand"><strong>Ekko</strong> — cada mensaje es una onda.</p>
    </main>

    <script src="/js/offline.js" defer></script>
</body>
</html>
