<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#06284a">
    <meta name="description" content="Ekko no tiene conexión a Internet en este momento.">

    <title>Sin conexión · Ekko</title>

    <link rel="icon" type="image/svg+xml" href="/images/ekko-logo.svg">

    <!-- Estilos generales de Ekko -->
    <link rel="stylesheet" href="/css/core.css">
    <link rel="stylesheet" href="/css/ekko-fx.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/home.css">

    <!-- Tema de Ekko -->
    <script src="/js/ekko-theme.js" defer></script>
</head>

<body>

    <main class="ek-container">

        <!-- Decoración de ondas -->
        <div class="ek-waves" aria-hidden="true">
            <div class="ek-wave"></div>
            <div class="ek-wave"></div>
            <div class="ek-wave"></div>
        </div>

        <!-- Contenido principal -->
        <section class="ek-card text-center"
                 aria-labelledby="offlineTitle">

            <img
                src="/images/ekko-logo.svg"
                alt="Logo de Ekko"
                width="90"
                height="90"
                style="object-fit: contain;"
            >

            <h1 class="ek-display mt-4" id="offlineTitle">
                Parece que perdimos la señal
            </h1>

            <p id="offlineMsg" role="status" aria-live="polite">
                En este momento no podemos conectarnos a Ekko.
            </p>

            <p>
                Comprueba tu conexión Wi-Fi o tus datos móviles.
                Cuando vuelva Internet, podrás regresar y continuar
                tus conversaciones.
            </p>

            <button
                type="button"
                class="btn btn-ekko"
                id="retryConnection">
                <span aria-hidden="true">↻</span>
                Intentar de nuevo
            </button>

            <p class="mt-4 mb-0">
                <strong>Ekko</strong>
                <span> · Cada mensaje es una onda. Que llegue lejos.</span>
            </p>

        </section>

    </main>

    <script src="/js/offline.js" defer></script>

</body>
</html>
