<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06284a">
    <title>Sin conexión · Ekko</title>
    <link rel="icon" type="image/svg+xml" href="images/ekko-logo.svg">
    <link rel="stylesheet" href="css/ekko.css">
    <link rel="stylesheet" href="css/offline.css">
    <script src="js/ekko-theme.js"></script>
</head>
<body>
<main class="ek-center">
    <div class="ek-waves" aria-hidden="true">
        <div class="ek-wave"></div><div class="ek-wave"></div><div class="ek-wave"></div>
    </div>

    <section class="ek-center-card">
        <img class="ek-logo-mid" src="images/ekko-logo.svg" alt="Logo de Ekko">
        <h1 class="ek-display">Estás sin conexión</h1>
        <p class="ek-verify-msg" role="status" id="offlineMsg">Ekko no puede llegar al océano ahora mismo.</p>
        <p class="ek-hint offline-hint">Revisa tu Wi-Fi o tus datos. Cuando vuelvas a conectarte, retomaremos tus conversaciones.</p>
    </section>
</main>
<script src="js/offline.js"></script>
</body>
</html>
