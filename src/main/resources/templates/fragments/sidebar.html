<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar" class="ek-sidebar">

    <nav aria-label="Navegación principal">

        <h2 class="ek-side-title">Menú</h2>

        <ul class="ek-side-list">

            <!-- 1. Chats: sección principal -->
            <li>
                <a class="ek-side-link"
                   th:href="@{/mensajes}">
                    <i class="bi bi-chat-dots-fill"></i>
                    <span>Chats</span>
                    <span class="ek-badge"
                          data-ekko-unread
                          hidden>0</span>
                </a>
            </li>

            <!-- 2. Contactos -->
            <li>
                <a class="ek-side-link"
                   th:href="@{/contactos}">
                    <i class="bi bi-people-fill"></i>
                    <span>Contactos</span>
                </a>
            </li>

            <!-- 3. Perfil: edición del perfil -->
            <li>
                <a class="ek-side-link"
                th:href="@{/inicio}"
                data-active-also="/perfil">
                    <i class="bi bi-person-circle"></i>
                    <span>Perfil</span>
                </a>
            </li>

            <!-- 4. Ajustes -->
            <li>
                <a class="ek-side-link"
                   th:href="@{/configuracion}"
                   data-active-also="/politica-privacidad,/cuenta">
                    <i class="bi bi-gear-fill"></i>
                    <span>Ajustes</span>
                </a>
            </li>

        </ul>
    </nav>

    <!-- Identidad visual de Ekko -->
    <div class="ek-side-footer">

        <strong>Ekko</strong>

        <small>Conversa sin fronteras.</small>

        <div class="ek-waves" aria-hidden="true">
            <div class="ek-wave"></div>
            <div class="ek-wave"></div>
            <div class="ek-wave"></div>
        </div>

    </div>

</aside>

</body>
</html>
