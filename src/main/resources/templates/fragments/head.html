<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#06284a">
    <title th:text="|${titulo} · Ekko|">Ekko</title>

    <link rel="icon" type="image/svg+xml" th:href="@{/images/ekko-logo.svg}">

    <!-- PWA -->
    <link rel="manifest" th:href="@{/manifest.json}">
    <link rel="apple-touch-icon" th:href="@{/icons/apple-touch-icon.png}">
    <meta name="ekko-sw" th:content="@{/sw.js}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Ekko">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Fuentes: Press Start 2P (detalles pixel) + Space Grotesk (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Estilos de Ekko (el orden importa) -->
    <link rel="stylesheet" th:href="@{/css/core.css}">
    <link rel="stylesheet" th:href="@{/css/ekko-fx.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/chat.css}">
    <link rel="stylesheet" th:href="@{/css/contacts.css}">
    <link rel="stylesheet" th:href="@{/css/account.css}">

    <script th:src="@{/js/ekko-theme.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script th:src="@{/js/ekko.js}" defer></script>
    <script th:src="@{/js/notificaciones.js}" defer></script>
    <script th:src="@{/js/pwa.js}" defer></script>
</head>
</html>
