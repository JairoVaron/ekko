<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="navbar" class="ek-navbar">
    <div class="ek-navbar-inner">

        <!-- MARCA -->
        <a class="ek-brand"
           th:href="@{/inicio}"
           aria-label="Ekko, ir al inicio">

            <img class="ek-brand-logo"
                 th:src="@{/images/ekko-logo.svg}"
                 alt=""
                 width="36"
                 height="36">

            <span class="ek-brand-name">Ekko</span>
        </a>

        <nav class="ek-nav-actions" aria-label="Acciones de la cuenta">

            <!-- INSTALAR APLICACIÓN -->
            <button type="button"
                    class="ek-icon-btn"
                    data-ekko-install
                    hidden
                    data-bs-toggle="tooltip"
                    data-bs-placement="bottom"
                    title="Instalar Ekko"
                    aria-label="Instalar Ekko como aplicación">

                <i class="bi bi-download"></i>
                <span class="ek-btn-label">Instalar Aplicación</span>
            </button>

            <!-- SONIDOS -->
            <button type="button"
                    class="ek-icon-btn"
                    data-ekko-sound-toggle
                    data-bs-toggle="tooltip"
                    data-bs-placement="bottom"
                    title="Sonidos"
                    aria-label="Activar o silenciar sonidos">

                <i class="bi bi-volume-up-fill"></i>
            </button>

            <!-- TEMA -->
            <button type="button"
                    class="ek-icon-btn"
                    data-ekko-theme-toggle
                    data-bs-toggle="tooltip"
                    data-bs-placement="bottom"
                    title="Modo claro u oscuro"
                    aria-label="Cambiar tema">

                <i class="bi bi-moon-stars-fill"></i>
            </button>

            <!-- NOTIFICACIONES -->
            <div class="dropdown">

                <button type="button"
                        class="ek-icon-btn"
                        data-ekko-bell
                        data-bs-toggle="dropdown"
                        data-bs-auto-close="outside"
                        aria-expanded="false"
                        aria-label="Notificaciones">

                    <i class="bi bi-bell-fill"></i>
                    <span class="ek-dot" data-ekko-unread hidden>0</span>
                </button>

                <div class="dropdown-menu dropdown-menu-end ek-bell-menu">

                    <div class="ek-bell-head">
                        <h6 class="m-0">Notificaciones</h6>

                        <button type="button"
                                class="ek-link-btn"
                                data-ekko-bell-clear>
                            Limpiar
                        </button>
                    </div>

                    <button type="button"
                            class="ek-bell-enable"
                            data-ekko-enable-desktop
                            hidden>

                        <i class="bi bi-bell"></i>
                        Activar avisos del navegador
                    </button>

                    <div data-ekko-bell-list>

                        <div class="ek-empty" data-ekko-bell-empty>
                            <i class="bi bi-chat-dots"></i>
                            Sin avisos nuevos.
                        </div>

                    </div>
                </div>
            </div>

            <!-- MENÚ DEL USUARIO -->
            <div class="dropdown ms-1">

                <button type="button"
                        class="ek-user-btn"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">

                    <!-- AVATAR CIRCULAR -->
                    <span class="ek-user-avatar"
                          style="width:36px;height:36px;min-width:36px;min-height:36px;flex:0 0 36px;position:relative;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;border-radius:50%;">

                        <!-- FOTOGRAFÍA -->
                        <img th:if="${currentUser != null
                                     and currentUser.avatarUrl != null
                                     and !#strings.isEmpty(currentUser.avatarUrl)}"
                             th:src="${currentUser.avatarUrl}"
                             alt="Mi foto de perfil"
                             class="ek-user-avatar-img"
                             width="36"
                             height="36"
                             loading="lazy"
                             decoding="async"
                             referrerpolicy="no-referrer"
                             style="position:absolute;inset:0;width:36px;height:36px;min-width:36px;max-width:36px;min-height:36px;max-height:36px;object-fit:cover;border-radius:50%;"
                             onerror="this.hidden=true; this.nextElementSibling.hidden=false;">

                        <!-- INICIAL -->
                        <span class="ek-user-avatar-initial"
                              th:hidden="${currentUser != null
                                          and currentUser.avatarUrl != null
                                          and !#strings.isEmpty(currentUser.avatarUrl)}"
                              th:text="${currentUser != null
                                  ? (!#strings.isEmpty(currentUser.displayName)
                                      ? #strings.substring(currentUser.displayName, 0, 1).toUpperCase()
                                      : (!#strings.isEmpty(currentUser.username)
                                          ? #strings.substring(currentUser.username, 0, 1).toUpperCase()
                                          : 'M'))
                                  : 'M'}">

                            M
                        </span>

                    </span>

                    <!-- NOMBRE -->
                    <span class="ek-user-name"
                          th:text="${currentUser != null
                              ? (!#strings.isEmpty(currentUser.displayName)
                                  ? currentUser.displayName
                                  : currentUser.username)
                              : 'Mi cuenta'}">

                        Mi cuenta
                    </span>

                    <i class="bi bi-chevron-down small d-none d-md-inline"></i>

                </button>

                <!-- OPCIONES -->
                <ul class="dropdown-menu dropdown-menu-end">

                    <li>
                        <a class="dropdown-item" th:href="@{/inicio}">
                            <i class="bi bi-person-circle"></i>
                            Mi perfil
                        </a>
                    </li>

                    <li>
                        <a class="dropdown-item" th:href="@{/configuracion}">
                            <i class="bi bi-gear-fill"></i>
                            Configuración
                        </a>
                    </li>

                    <li>
                        <a class="dropdown-item" th:href="@{/politica-privacidad}">
                            <i class="bi bi-shield-check"></i>
                            Política y privacidad
                        </a>
                    </li>

                    <li>
                        <hr class="dropdown-divider">
                    </li>

                    <li>
                        <form class="m-0"
                              th:action="@{/logout}"
                              method="post"
                              data-ekko-confirm="Saldrás de tu cuenta en este dispositivo."
                              data-confirm-title="¿Cerrar tu sesión?"
                              data-confirm-ok="Cerrar sesión">

                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">

                            <button type="submit"
                                    class="dropdown-item text-danger w-100">

                                <i class="bi bi-box-arrow-right"></i>
                                Cerrar sesión
                            </button>

                        </form>
                    </li>

                </ul>
            </div>

        </nav>
    </div>
</header>

</body>
</html>
