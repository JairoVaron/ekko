<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Mis conversaciones')}"></head>
<body th:attr="data-current-user-id=${currentUserId}">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="ek-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="ek-main">
        <div class="ek-container">

            <header class="ek-page-head">
                <div>
                    <h1 class="ek-display">Chats</h1>
                    <p>Sesión iniciada como <strong th:text="${username}"></strong></p>
                </div>

                <p id="connectionStatus" class="ek-status-pill" role="status" aria-live="polite" data-state="connecting">
                    Conectando...
                </p>
            </header>

            <p class="alert alert-ek-error" th:if="${error}" th:text="${error}" role="alert" data-ekko-sound-on-load="error"></p>

            <h2 class="visually-hidden">Conversaciones privadas</h2>

            <div class="ek-search" th:unless="${#lists.isEmpty(conversations)}">
                <i class="bi bi-search" aria-hidden="true"></i>
                <input id="conversationFilter" type="search" class="form-control"
                       placeholder="Buscar en tus chats" aria-label="Buscar en tus chats" autocomplete="off">
            </div>

            <div th:if="${#lists.isEmpty(conversations)}" id="emptyConversations" class="ek-empty-state">
                <i class="bi bi-chat-heart"></i>
                <p class="mb-3">Todavía no tienes conversaciones. Ve a Contactos para iniciar una.</p>
                <a class="btn btn-ekko" th:href="@{/contactos}"><i class="bi bi-people-fill"></i>Ir a Contactos</a>
            </div>

            <div class="ek-conv-list">

                <article th:each="conversation : ${conversations}"
                         class="ek-conv conversation"
                         th:with="nombre=${conversation.otherDisplayName != null and !#strings.isEmpty(conversation.otherDisplayName) ? conversation.otherDisplayName : conversation.otherUsername}"
                         th:attr="data-conversation-id=${conversation.conversationId},
                                  data-other-user-id=${conversation.otherUserId},
                                  data-other-name=${nombre},
                                  data-search=${#strings.toLowerCase(nombre + ' ' + conversation.otherUsername)}">

                    <!-- Se muestra la inicial; si hay foto, se superpone -->
                    <div class="ek-conv-avatar">
                        <span class="ek-initial"
                              th:attr="data-name=${nombre}"
                              th:text="${!#strings.isEmpty(nombre) ? #strings.toUpperCase(#strings.substring(nombre, 0, 1)) : '?'}">A</span>
                        <img th:if="${conversation.otherAvatarUrl != null and !#strings.isEmpty(conversation.otherAvatarUrl)}"
                             th:src="${conversation.otherAvatarUrl}"
                             th:alt="${'Foto de perfil de ' + nombre}"
                             loading="lazy" decoding="async" referrerpolicy="no-referrer"
                             data-hide-on-error>
                    </div>

                    <div class="ek-conv-body">
                        <div class="ek-conv-top">
                            <h3>
                                <a class="stretched-link"
                                   th:href="@{/mensajes/{id}(id=${conversation.conversationId})}"
                                   th:text="${nombre}"></a>
                            </h3>
                            <small class="ek-conv-time last-message-at"
                                   th:if="${conversation.lastMessageAt != null}"
                                   th:text="${#temporals.format(conversation.lastMessageAt, 'dd/MM HH:mm')}"></small>
                            <small class="ek-conv-time last-message-at"
                                   th:unless="${conversation.lastMessageAt != null}"></small>
                        </div>

                        <div class="ek-conv-last">
                            <span class="last-message"
                                th:text="${conversation.lastMessage != null
                                    ? conversation.lastMessage
                                    : 'Inicia una conversación'}">
                                Inicia una conversación
                            </span>
                            <span
                                class="conversation-typing"
                                hidden
                                role="status"
                                aria-live="polite">
                                <span class="conversation-typing-dots">
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                </span>
                                Está escribiendo...
                            </span>
                        </div>
                    </div>

                    <p class="ek-unread-pill unread"
                       th:classappend="${conversation.unreadCount > 0 ? ' has-unread' : ''}"
                       title="Mensajes sin leer">
                        <span class="visually-hidden">Mensajes sin leer: </span>
                        <strong class="unread-count" th:text="${conversation.unreadCount}">0</strong>
                    </p>

                </article>
            </div>

            <p id="noMatches" class="ek-empty-state mt-3" hidden>
                <i class="bi bi-search-heart"></i>
                No encontramos chats con ese nombre.
            </p>

        </div>
    </main>
</div>

<script th:src="@{/js/conversaciones.js}" defer></script>
</body>
</html>
