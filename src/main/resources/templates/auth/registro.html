<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
</head>
<body>

    <main>
        <h1>Crear cuenta</h1>

        <p th:if="${error}" th:text="${error}" role="alert"></p>

        <form th:action="@{/registro}"
              th:object="${form}"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div>
                <label for="username">Nombre de usuario</label>
                <input id="username"
                       type="text"
                       th:field="*{username}"
                       autocomplete="username"
                       required>
                <small th:if="${#fields.hasErrors('username')}"
                       th:errors="*{username}"></small>
            </div>

            <div>
                <label for="email">Correo electrónico</label>
                <input id="email"
                       type="email"
                       th:field="*{email}"
                       autocomplete="email"
                       required>
                <small th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}"></small>
            </div>

            <div>
                <label for="displayName">Nombre para mostrar</label>
                <input id="displayName"
                       type="text"
                       th:field="*{displayName}"
                       autocomplete="name"
                       maxlength="80"
                       required>
                <small th:if="${#fields.hasErrors('displayName')}"
                       th:errors="*{displayName}"></small>
            </div>

            <div>
                <label for="password">Contraseña</label>
                <input id="password"
                       type="password"
                       th:field="*{password}"
                       autocomplete="new-password"
                       minlength="8"
                       maxlength="72"
                       required>
                <small th:if="${#fields.hasErrors('password')}"
                       th:errors="*{password}"></small>
            </div>

            <button type="submit">Registrarme</button>
        </form>

        <p>
            ¿Ya tienes cuenta?
            <a th:href="@{/login}">Iniciar sesión</a>
        </p>
    </main>

</body>
</html>
