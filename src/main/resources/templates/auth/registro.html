<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Crear cuenta')}"></head>
<body>

<div class="ek-auth">

    <section class="ek-auth-brand" aria-label="Ekko">
        <div class="ek-bubbles" data-ekko-bubbles="16" aria-hidden="true"></div>
        <img class="ek-logo-big" th:src="@{/images/ekko-logo.svg}" alt="Logo de Ekko, un delfín saltando" data-ekko-splash>
        <h1 class="ek-display">Únete a la corriente</h1>
        <p>Crea tu cuenta y encuentra a tu gente en el océano de Ekko.</p>
        <div class="ek-pills">
            <span class="ek-pill"><i class="bi bi-chat-heart-fill"></i>Chats en vivo</span>
            <span class="ek-pill"><i class="bi bi-person-hearts"></i>Contactos</span>
            <span class="ek-pill"><i class="bi bi-lock-fill"></i>Tú decides</span>
        </div>
        <div class="ek-waves" aria-hidden="true">
            <div class="ek-wave"></div><div class="ek-wave"></div><div class="ek-wave"></div>
        </div>
    </section>

    <main class="ek-auth-form">
        <div class="ek-auth-card">

            <h2 class="ek-display">Crear cuenta</h2>
            <p class="text-muted-ek mb-4">Elige cómo quieres que te encuentren.</p>

            <p class="alert alert-ek-error" th:if="${error}" role="alert" data-ekko-sound-on-load="error">
                <i class="bi bi-exclamation-octagon-fill"></i>
                <span th:text="${error}"></span>
            </p>

            <form th:action="@{/registro}" th:object="${form}" method="post" data-ekko-loading novalidate>

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="ek-field">
                    <label for="username">Nombre de usuario</label>
                    <div class="ek-input-group">
                        <i class="bi bi-at"></i>
                        <input id="username" type="text" class="form-control" th:field="*{username}"
                               th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                               placeholder="tu_usuario" autocomplete="username" required>
                    </div>
                    <small class="ek-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small>
                </div>

                <div class="ek-field">
                    <label for="email">Correo electrónico</label>
                    <div class="ek-input-group">
                        <i class="bi bi-envelope-fill"></i>
                        <input id="email" type="email" class="form-control" th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                               placeholder="tu@correo.com" autocomplete="email" required>
                    </div>
                    <small class="ek-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                </div>

                <div class="ek-field">
                    <label for="displayName">Nombre para mostrar</label>
                    <div class="ek-input-group">
                        <i class="bi bi-emoji-smile-fill"></i>
                        <input id="displayName" type="text" class="form-control" th:field="*{displayName}"
                               th:classappend="${#fields.hasErrors('displayName')} ? 'is-invalid'"
                               placeholder="Así te verán tus contactos" autocomplete="name" maxlength="80" required>
                    </div>
                    <small class="ek-error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}"></small>
                </div>

                <div class="ek-field">
                    <label for="password">Contraseña</label>
                    <div class="ek-input-group">
                        <i class="bi bi-lock-fill"></i>
                        <input id="password" type="password" class="form-control" th:field="*{password}"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                               placeholder="Mínimo 8 caracteres" autocomplete="new-password"
                               minlength="8" maxlength="72" required>
                        <button type="button" class="ek-icon-btn ek-toggle-pass" data-toggle-password="password" aria-label="Mostrar contraseña">
                            <i class="bi bi-eye-fill"></i>
                        </button>
                    </div>
                    <div class="ek-strength" data-password-strength="password" data-level="0" aria-hidden="true">
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <small class="ek-hint" data-strength-label aria-live="polite">Escribe una contraseña</small>
                    <small class="ek-error" data-caps-warning hidden><i class="bi bi-capslock-fill"></i> Tienes las mayúsculas activadas.</small>
                    <small class="ek-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
                </div>

                <p class="ek-hint mb-4"><i class="bi bi-envelope-exclamation me-1"></i><span>Revisa tu correo spam</span></p>

                <button type="submit" class="btn btn-ekko w-100 mt-2" data-loading-text="Creando tu cuenta…">
                    Registrarme
                </button>
            </form>

            <p class="text-center mt-4 mb-0">
                ¿Ya tienes cuenta?
                <a class="fw-bold" th:href="@{/login}">Iniciar sesión</a>
            </p>
        </div>
    </main>
</div>

<script th:src="@{/js/auth.js}" defer></script>
</body>
</html>
