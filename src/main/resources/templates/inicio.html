<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 25px 0;
        }

        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #ddd;
        }

        .profile-info {
            overflow-wrap: anywhere;
        }

        .profile-bio {
            white-space: pre-wrap;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 20px 0;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0;
        }

        button {
            padding: 9px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>
<main>
    <h1>Bienvenido a la Plataforma de Comunicación</h1>

    <section class="profile" aria-label="Mi perfil">
        <img
            class="profile-avatar"
            th:src="${currentUser.avatarUrl != null
                and !#strings.isEmpty(currentUser.avatarUrl)
                ? currentUser.avatarUrl
                : '/images/avatar-default.svg'}"
            onerror="this.onerror=null;this.src='/images/avatar-default.svg';"
            alt="Foto de perfil">

        <div class="profile-info">
            <h2 th:text="${currentUser.displayName != null
                and !#strings.isEmpty(currentUser.displayName)
                ? currentUser.displayName
                : currentUser.username}">
                Nombre visible
            </h2>

            <p>
                <strong>Usuario:</strong>
                <span th:text="${'@' + currentUser.username}">usuario</span>
            </p>

            <p class="profile-bio"
               th:if="${currentUser.bio != null
                   and !#strings.isEmpty(currentUser.bio)}"
               th:text="${currentUser.bio}">
                Biografía del usuario
            </p>

            <p th:unless="${currentUser.bio != null
                and !#strings.isEmpty(currentUser.bio)}">
                Todavía no has añadido una biografía.
            </p>

            <a th:href="@{/perfil}">Ver o editar mi perfil</a>
        </div>
    </section>

    <hr>

    <nav aria-label="Navegación principal">
        <a th:href="@{/contactos}">Contactos</a>
        <a th:href="@{/mensajes}">Mis conversaciones</a>
        <a th:href="@{/configuracion}">Configuración</a>
    </nav>

    <div class="actions">
        <a th:href="@{/perfil}">
            <button type="button">Editar perfil</button>
        </a>

        <a th:href="@{/mensajes}">
            <button type="button">Abrir conversaciones</button>
        </a>
    </div>

    <form th:action="@{/logout}" method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <button type="submit">Cerrar sesión</button>
    </form>
</main>
</body>
</html>
